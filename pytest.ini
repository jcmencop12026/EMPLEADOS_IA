[pytest]
testpaths = tests
pythonpath = backend
markers =
    auth: pruebas de autorización y autenticación
    tenant: pruebas de aislamiento por empresa/tenant
    knowledge: pruebas del centro de conocimiento
    notifications: pruebas de notificaciones y alertas
    automations: pruebas de automatizaciones y scheduler
    migrations: pruebas de migraciones y arranque de base de datos
    operations: pruebas del centro de operaciones y orquestador
    salud: pruebas del motor especializado IPS (SALUD-960)
    motor: pruebas del motor analítico transversal (MOTOR-ANALITICO-1000)
    windows: pruebas específicas de comportamiento Windows
    certification: certificación rápida reproducible (CI por PR)
    certification_intensive: certificación intensiva manual (race 100 iteraciones)
    postgresql: requiere DATABASE_URL PostgreSQL
    concurrency: pruebas de concurrencia o carrera
