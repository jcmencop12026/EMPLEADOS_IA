name: Certificación QA

on:
  pull_request:
  workflow_dispatch:
    inputs:
      grupo_focal:
        description: "Grupo focal de tests (auth, tenant, knowledge, notifications, automations, migrations, operations, certification, certification_intensive) o ruta tests/..."
        required: false
        default: ""
      certification_intensive:
        description: "Ejecutar certificación intensiva (race 100 iteraciones) — solo manual"
        type: boolean
        required: false
        default: false

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-postgresql:
    name: Backend y PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: empleados_test
          POSTGRES_PASSWORD: empleados_test
          POSTGRES_DB: empleados_ia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U empleados_test -d empleados_ia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://empleados_test:empleados_test@localhost:5432/empleados_ia_test
      JWT_SECRET: ci-test-secret-qa-infra-001
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias backend
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validar conexión PostgreSQL
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as conn:
              value = conn.execute(text("SELECT 1")).scalar_one()
              assert value == 1
          print("PostgreSQL OK")
          PY

      - name: Validar gobierno de migraciones
        working-directory: backend
        run: |
          PYTHONPATH=. python scripts/validate_migrations.py
          PYTHONPATH=. alembic heads | tee /tmp/alembic_heads.txt
          test "$(grep -c '(head)' /tmp/alembic_heads.txt)" -eq 1

      - name: Migraciones Alembic (upgrade head)
        working-directory: backend
        run: |
          PYTHONPATH=. alembic upgrade head

      - name: Migraciones Alembic (downgrade y upgrade)
        working-directory: backend
        run: |
          PYTHONPATH=. alembic downgrade 4355c73adcb8
          PYTHONPATH=. alembic upgrade head

      - name: Certificación rápida (PR)
        run: |
          set -euo pipefail
          set +e
          OUTPUT=$(PYTHONPATH=backend:. python -m pytest --collect-only -q -m "certification and not certification_intensive" 2>&1)
          CODE=$?
          set -e
          COLLECTED=$(echo "$OUTPUT" | tail -1)
          if [ "$CODE" -eq 5 ] || echo "$COLLECTED" | grep -qE "collected 0 items|no tests collected"; then
            echo "Sin tests de certificación en esta rama — step omitido."
            exit 0
          fi
          echo "$COLLECTED"
          PYTHONPATH=backend:. python -m pytest -m "certification and not certification_intensive" -v

      - name: Certificación PostgreSQL
        run: |
          set -euo pipefail
          set +e
          OUTPUT=$(PYTHONPATH=backend:. python -m pytest --collect-only -q -m "certification and postgresql" 2>&1)
          CODE=$?
          set -e
          COLLECTED=$(echo "$OUTPUT" | tail -1)
          if [ "$CODE" -eq 5 ] || echo "$COLLECTED" | grep -qE "collected 0 items|no tests collected"; then
            echo "Sin tests postgresql de certificación — step omitido."
            exit 0
          fi
          echo "$COLLECTED"
          PYTHONPATH=backend:. python -m pytest -m "certification and postgresql" -v

      - name: Certificación intensiva (manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.certification_intensive == 'true'
        run: |
          PYTHONPATH=backend:. python -m pytest -m certification_intensive -v

      - name: Ejecutar tests backend
        run: |
          if [ -n "${{ github.event.inputs.grupo_focal }}" ]; then
            FOCAL="${{ github.event.inputs.grupo_focal }}"
            if [[ "$FOCAL" == tests/* ]]; then
              PYTHONPATH=backend:. python -m pytest "$FOCAL" -v
            else
              PYTHONPATH=backend:. python -m pytest -m "$FOCAL" -v
            fi
          else
            PYTHONPATH=backend:. python -m pytest -m "not certification_intensive" -v
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar frontend
        run: npm run build

      - name: Auditoría de dependencias
        run: npm audit --audit-level=moderate

  validacion-git:
    name: Validación Git
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar espacios en blanco conflictivos
        run: git fetch origin main && git diff --check origin/main...HEAD

  pruebas-windows:
    name: Pruebas Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias backend
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Pruebas de arranque SQLite (Windows)
        run: python -m pytest tests/test_db_startup_805e.py -v

      - name: Certificación Windows (process tree)
        shell: bash
        run: |
          set -euo pipefail
          set +e
          OUTPUT=$(PYTHONPATH=backend:. python -m pytest --collect-only -q -m "certification and windows" 2>&1)
          CODE=$?
          set -e
          COLLECTED=$(echo "$OUTPUT" | tail -1)
          if [ "$CODE" -eq 5 ] || echo "$COLLECTED" | grep -qE "collected 0 items|no tests collected"; then
            echo "Sin tests Windows de certificación — step omitido."
            exit 0
          fi
          echo "$COLLECTED"
          PYTHONPATH=backend:. python -m pytest -m "certification and windows" -v
