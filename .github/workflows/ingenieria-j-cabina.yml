name: INGENIERIA-J Cabina Unificada
on:
  push:
    branches: [ "ingenieria-j/cierre-integral-20260929" ]
  workflow_dispatch:
jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
